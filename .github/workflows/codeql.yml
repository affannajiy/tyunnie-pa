## Static analysis (SECURITY_Rulebook §3.1 — shift-left scanning).
## Runs on every push and PR to main, plus weekly so a newly-published query
## finds old code that was clean when it was written.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 02:00 UTC — after Dependabot's Monday run.
    - cron: "0 2 * * 1"

# Least privilege (§1.3): read the code, write findings to the Security tab,
# nothing else. This overrides whatever the repo default is.
permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze JS/TS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # security-extended adds the lower-precision queries — worth the extra
          # noise on a codebase this size, where a human reads every alert.
          queries: security-extended

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
