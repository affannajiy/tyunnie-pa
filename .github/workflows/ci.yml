## Build, lint, and dependency audit on every change.
##
## The audit step is the one that matters for §5b.6: it fails the build on a
## HIGH-or-worse advisory in the *production* tree. `--omit=dev` is deliberate —
## the dev tree carries eslint advisories that cannot reach a deployed user, and
## a check that cries wolf every week is a check nobody reads.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # Secret scanning needs history to scan, not just the tip commit
          # (§5c.3 — "scan history too").
          fetch-depth: 0
          # Don't leave the job's GITHUB_TOKEN in .git/config where any later
          # step, including one inside a dependency's script, could read it.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Pin npm to the major that WROTE package-lock.json. `overrides` are the
      # part of a lockfile whose resolution differs most between npm majors, and
      # this repo overrides `brace-expansion` under four separate parents. Node
      # 22 ships npm 10; letting it read an npm 11 lock is how a lockfile passes
      # locally and fails `npm ci` here.
      - name: Pin npm
        run: npm i -g npm@11

      # `npm ci` installs exactly the lockfile — a bumped transitive dep can
      # never sneak in between a local test and a CI run.
      - name: Install
        run: npm ci

      # §5c.3 — a credential must not reach the default branch. GitHub's own
      # push protection catches known provider formats at push time; this
      # catches what it does not, and covers history on every PR.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisory: surfaces dev-tree findings in the log without failing the run.
      - name: Audit dev dependencies (informational)
        run: npm audit --audit-level=high || true

      # Advisory for now: main currently carries 42 pre-existing errors from
      # eslint-config-next 16's react-hooks rules (set-state-in-effect and
      # friends). Blocking on it would make CI red on day one and train everyone
      # to ignore it. Clear the backlog, then drop the `|| true`.
      - name: Lint (informational)
        run: npm run lint || true

      # Also the TypeScript check — `next build` type-checks the whole project.
      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. These are public-by-design anon values in
          # production too, and nothing here contacts a real project — the build
          # only needs the vars to exist. No real secret belongs in CI for this.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
